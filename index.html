<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODOアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <form id="add-form" class="add-form">
      <label for="new-todo" class="visually-hidden">新しいタスク</label>
      <input id="new-todo" type="text" placeholder="やることを入力して Enter" autocomplete="off" maxlength="200" autofocus>
      <button type="submit">追加</button>
    </form>

    <nav class="filters" aria-label="表示の絞り込み">
      <button type="button" data-filter="all" aria-pressed="true">すべて</button>
      <button type="button" data-filter="active" aria-pressed="false">未完了</button>
      <button type="button" data-filter="done" aria-pressed="false">完了</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="footer">
      <span id="count" aria-live="polite"></span>
      <button id="clear-done" type="button" class="link-button">完了済みを削除</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
